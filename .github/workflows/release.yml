# Build the Windows installer and the single-file exe when a GitHub release is
# published, and attach both to the release. Run it by hand (Actions tab ->
# Build release -> Run workflow) to get the same files as a workflow artifact
# without a release.
#
# The release tag must match ytuploader.__version__ (with or without a leading
# "v"), so the files are never labelled with the wrong version.

name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # upload release assets

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create venv
        # The build scripts use .venv\Scripts\python.exe, same as locally.
        run: python -m venv .venv

      - name: Read version
        id: version
        run: |
          $version = (.venv\Scripts\python.exe -c "import ytuploader; print(ytuploader.__version__)").Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
            if ($tag -ne $version) {
              throw "Release tag '${{ github.event.release.tag_name }}' doesn't match ytuploader.__version__ '$version'. Bump ytuploader/__init__.py or fix the tag."
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: .\build_installer.ps1

      - name: Build single-file exe
        run: .\build_exe.ps1

      - name: Collect files
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\ytuploader-setup-$v.exe" out\
          Copy-Item dist\ytuploader.exe "out\ytuploader-$v.exe"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: ytuploader-${{ steps.version.outputs.version }}
          path: out/*.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem out\*.exe).FullName --clobber
